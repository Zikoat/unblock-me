<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f3f2ee">
<!-- Added to an iPhone's home screen, the game opens without Safari's bars: the nearest
     thing to full screen there (iPhone Safari has no fullscreen for pages). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Unblock Me">
<title>Unblock Me</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='12' height='12' rx='2' fill='%234f6d8f'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3f2ee; }
  /* Things on the screen live in #view, which main.ts keeps sized to the current view (the
     smaller border when it is on), so they always sit inside it. */
  #view { position: fixed; pointer-events: none; }
  #view > * { pointer-events: auto; }
  /* Turns a little every frame, so frames keep coming and the fps counter shows the real rate. */
  #spin { position: absolute; top: 7px; left: 9px; width: 7px; height: 7px; border-radius: 1.5px; background: #b9b6ad; pointer-events: none !important; }
  #fps { position: absolute; top: 6px; left: 22px; font: 11px/1 ui-monospace, monospace; color: #8a877e; pointer-events: none !important; }
  #tip { position: fixed; display: none; white-space: pre-line; max-width: 260px; padding: 7px 10px; border-radius: 8px; background: #1d1d1f; color: #f3f2ee; font: 13px/1.4 system-ui, sans-serif; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.18); z-index: 2; }
  /* The island's next button, under its finish card (main.ts sets its top). */
  #next { position: absolute; left: 50%; transform: translateX(-50%); padding: 14px 30px; border: 0; border-radius: 999px; background: #f2b632; color: #1d1d1f; font: 800 18px/1 system-ui, -apple-system, "Segoe UI", sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,.3); cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #next[hidden] { display: none; }
  canvas { display: block; width: 100vw; height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
</style>
</head>
<body>
<canvas></canvas>
<div id="view">
<div id="spin"></div>
<div id="fps"></div>
<div id="tip" role="tooltip"></div>
<button id="next" hidden>Next level</button>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
