<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f3f2ee">
<title>Quick test</title>
<style>
  /* A guided test for Telegram's in-app browser, one step at a time: where the page was
     opened, how swipes reach it under four settings (resuming if a swipe closes it), and
     which ways out of Telegram work. Results go to the server as play data (play-data/). */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #f3f2ee; color: #1d1d1f; font: 17px/1.45 system-ui, sans-serif; overscroll-behavior: none; }
  main { max-width: 480px; min-height: 100%; margin: 0 auto; padding: 28px 20px; display: flex; flex-direction: column; gap: 16px; }
  .count { font-size: 14px; color: #6b6e73; }
  h1 { font-size: 23px; line-height: 1.25; margin: 0; }
  p { margin: 0; }
  .buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  button { font: inherit; font-weight: 600; padding: 14px 16px; border: 0; border-radius: 12px; background: #1d1d1f; color: #f3f2ee; cursor: pointer; }
  button.light { background: #e3e2dc; color: #1d1d1f; }
  button:disabled { opacity: .35; cursor: default; }
  .box { height: 220px; border-radius: 16px; background: #4f6d8f; color: #fff; display: grid; place-items: center; text-align: center; font-size: 20px; font-weight: 650; user-select: none; -webkit-user-select: none; padding: 12px; }
  .box small { display: block; font-size: 15px; font-weight: 400; opacity: .85; margin-top: 6px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
// Where the test is, and its results so far, kept so a swipe that closes the page (or a
// way out that opens another browser) can carry on where it left off.
const KEY = "telegram-test";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) ?? null; } catch { return null; } };
if (new URLSearchParams(location.search).has("restart")) try { localStorage.removeItem(KEY); } catch {}
const state = load() ?? { id: (crypto.randomUUID?.() ?? String(Math.random()).slice(2)).replace(/-/g, "").slice(0, 24), step: 0, results: { boxes: {}, exits: {} }, visits: 0 };
state.visits++;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

const proxy = window.TelegramWebviewProxy;
const facts = {
  userAgent: navigator.userAgent,
  userAgentData: navigator.userAgentData ? { brands: navigator.userAgentData.brands, mobile: navigator.userAgentData.mobile, platform: navigator.userAgentData.platform } : null,
  telegramGlobals: Object.keys(window).filter((k) => /telegram/i.test(k)),
  proxyPostEvent: typeof proxy?.postEvent,
  webviewInUserAgent: /; wv\)/.test(navigator.userAgent),
  referrer: document.referrer, url: location.href, historyLength: history.length,
  screen: { width: screen.width, height: screen.height, innerWidth, innerHeight, dpr: devicePixelRatio },
  maxTouchPoints: navigator.maxTouchPoints,
};
const detected = !!proxy || /Telegram/i.test(navigator.userAgent);
(state.results.visits ??= []).push({ at: new Date().toISOString(), detected, facts, from: new URLSearchParams(location.search).get("from") });

// Sent after every step, replacing this test's last upload.
const send = (beacon = false) => {
  save();
  const body = JSON.stringify({ kind: "telegram-test", id: state.id, sentAt: new Date().toISOString(), step: state.step, ...state.results });
  const url = `play-data?device=tg-${state.id}`;
  if (beacon) navigator.sendBeacon(url, new Blob([body], { type: "application/json" }));
  else fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body }).catch(() => {});
};

const BOXES = [
  { key: "A", label: "normal", setup: () => {} },
  { key: "B", label: "touch-action none", style: "touch-action: none" },
  { key: "C", label: "blocked at touch start", style: "touch-action: none", block: "touchstart" },
  { key: "D", label: "blocked while moving", style: "touch-action: none", block: "touchmove" },
];
const EXITS = [
  { key: "telegram", label: "Open with Telegram" },
  { key: "intent", label: "Open in a browser", android: true },
  { key: "chrome", label: "Open in Chrome", android: true },
  { key: "window", label: "Open in a new window" },
];
const android = /Android/i.test(navigator.userAgent);
const target = location.origin + location.pathname;

// The steps, in order.
const steps = [
  { kind: "where" },
  ...BOXES.map((box) => ({ kind: "box", box })),
  ...EXITS.map((exit) => ({ kind: "exit", exit })),
  { kind: "done" },
];
const app = document.getElementById("app");
const next = () => { state.step++; state.left = null; send(); show(); };

function show() {
  let s = steps[state.step];
  // Skip the ways out when not in Telegram, and the Android ones elsewhere.
  while (s && s.kind === "exit" && (state.results.where !== "telegram" || (s.exit.android && !android))) s = steps[++state.step];
  save();
  const counter = `<p class="count">Step ${Math.min(state.step + 1, steps.length)} of ${steps.length}</p>`;
  // Back after the page closed during a box: ask what happened.
  if (state.left !== null && state.left !== undefined && s?.kind === "box") {
    app.innerHTML = `${counter}<h1>Welcome back!</h1><p>Did swiping in the box close the page or go back?</p>
      <div class="buttons"><button data-a="yes">Yes, it closed</button><button class="light" data-a="no">No, I closed it myself</button></div>`;
    app.onclick = (e) => {
      const a = e.target.closest("button")?.dataset.a;
      if (!a) return;
      const r = (state.results.boxes[s.box.key] ??= {});
      r.closedPage = a === "yes";
      next();
    };
    return;
  }
  if (s.kind === "where") {
    app.innerHTML = `${counter}<h1>Where did you open this link?</h1>
      <div class="buttons"><button data-a="telegram">In Telegram</button><button class="light" data-a="other">Somewhere else</button></div>`;
    app.onclick = (e) => {
      const a = e.target.closest("button")?.dataset.a;
      if (!a) return;
      state.results.where = a;
      state.results.detected = detected;
      next();
    };
    return;
  }
  if (s.kind === "box") {
    const { box } = s, r = (state.results.boxes[box.key] ??= {});
    r.swipes = r.swipes ?? []; r.label = box.label;
    app.innerHTML = `${counter}<h1>Swipe left and right in the box</h1><p>A few times, fast and slow. If the page closes, just open the link again.</p>
      <div class="box" id="box" style="${box.style ?? ""}">Swipe here<small id="n">0 swipes</small></div>
      <div class="buttons"><button id="next" disabled>Next</button></div>`;
    const el = document.getElementById("box"), n = document.getElementById("n"), btn = document.getElementById("next");
    if (box.block) el.addEventListener(box.block, (e) => e.preventDefault(), { passive: false });
    let down = null, made = 0;
    el.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now(), moves: 0 }; state.left = "box"; save(); });
    el.addEventListener("pointermove", (e) => { if (down) { down.moves++; down.lx = e.clientX; down.ly = e.clientY; } });
    const end = (how) => (e) => {
      if (!down) return;
      r.swipes.push({ how, dx: Math.round((down.lx ?? down.x) - down.x), dy: Math.round((down.ly ?? down.y) - down.y), ms: Math.round(performance.now() - down.t), moves: down.moves });
      down = null; made++;
      state.left = null; save();
      n.textContent = `${made} swipe${made === 1 ? "" : "s"}`;
      if (made >= 3) btn.disabled = false;
    };
    el.addEventListener("pointerup", end("up"));
    el.addEventListener("pointercancel", end("taken by the browser"));
    app.onclick = (e) => { if (e.target.id === "next") { r.closedPage = false; next(); } };
    return;
  }
  if (s.kind === "exit") {
    const { exit } = s;
    app.innerHTML = `${counter}<h1>Can this get you out of Telegram?</h1><p>Tap the button. Then come back here (or to this page in the browser it opened) and say what happened.</p>
      <div class="buttons"><button id="go">${exit.label}</button></div>
      <div id="after" hidden><p>What happened?</p>
      <div class="buttons"><button class="light" data-a="browser">My phone's browser opened</button><button class="light" data-a="telegram">It stayed in Telegram</button><button class="light" data-a="nothing">Nothing happened</button></div></div>`;
    app.onclick = (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.id === "go") {
        state.results.exits[exit.key] = { tapped: true };
        save();
        // Only now ask what happened.
        b.hidden = true;
        document.getElementById("after").hidden = false;
        const url = `${target}?from=${exit.key}`;
        const intent = (pkg) => `intent://${location.host}${location.pathname}?from=${exit.key}#Intent;scheme=https;${pkg ? `package=${pkg};` : ""}S.browser_fallback_url=${encodeURIComponent(url)};end`;
        if (exit.key === "telegram") proxy?.postEvent ? proxy.postEvent("web_app_open_link", JSON.stringify({ url, try_browser: "chrome" })) : (state.results.exits.telegram.noProxy = true);
        if (exit.key === "intent") location.href = intent("");
        if (exit.key === "chrome") location.href = intent("com.android.chrome");
        if (exit.key === "window") window.open(url, "_blank");
        return;
      }
      if (b.dataset.a) {
        (state.results.exits[exit.key] ??= {}).outcome = b.dataset.a;
        next();
      }
    };
    return;
  }
  app.innerHTML = `<h1>All done, thanks!</h1><p>The results have been sent. You can close this page.</p><div class="buttons"><button class="light" onclick="location.href='?restart'">Start again</button></div>`;
  app.onclick = null;
  send();
}

// Leaving mid-box (a swipe that closed the page, say): send what is known so far.
addEventListener("pagehide", () => { if (state.left) (state.results.leftDuring ??= []).push(steps[state.step]?.box?.key ?? state.step); send(true); });
// Ask Telegram (if it listens) not to take swipes, as a Mini App can.
try { proxy?.postEvent?.("web_app_setup_swipe_behavior", JSON.stringify({ allow_vertical_swipe: false })); } catch {}
show();
</script>
</body>
</html>
