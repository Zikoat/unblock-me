<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f3f2ee">
<title>Quick test</title>
<style>
  /* A guided test for Telegram's in-app browser, one step at a time: which browser shows
     the page, whether swipes reach it (or the browser takes them to close itself) under a
     few layouts, and opening the page in the phone's own browser. Results go to the server
     as play data (play-data/ on the VM). */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #f3f2ee; color: #1d1d1f; font: 17px/1.45 system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 28px 20px; display: flex; flex-direction: column; gap: 16px; }
  .count { font-size: 14px; color: #6b6e73; }
  h1 { font-size: 23px; line-height: 1.25; margin: 0; }
  p { margin: 0; }
  .buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  button { font: inherit; font-weight: 600; padding: 14px 16px; border: 0; border-radius: 12px; background: #1d1d1f; color: #f3f2ee; cursor: pointer; }
  button.light { background: #e3e2dc; color: #1d1d1f; }
  button:disabled { opacity: .35; cursor: default; }
  .box { height: 220px; border-radius: 16px; background: #4f6d8f; color: #fff; display: grid; place-items: center; text-align: center; font-size: 20px; font-weight: 650; user-select: none; -webkit-user-select: none; padding: 12px; touch-action: none; }
  .box small { display: block; font-size: 15px; font-weight: 400; opacity: .85; margin-top: 6px; }
  /* A box over the whole screen, like the game's board. */
  .full { position: fixed; inset: 0; height: auto; border-radius: 0; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 24px; }
  .full button { background: #f3f2ee; color: #1d1d1f; }
</style>
</head>
<body>
<main id="app"></main>
<script>
// Where the test is, and its results so far, kept so a swipe that closes the page can carry
// on where it left off.
const KEY = "telegram-test-2";
if (new URLSearchParams(location.search).has("restart")) try { localStorage.removeItem(KEY); } catch {}
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) ?? null; } catch { return null; } };
const state = load() ?? { id: (crypto.randomUUID?.() ?? String(Math.random()).slice(2)).replace(/-/g, "").slice(0, 24), step: 0, results: { boxes: {} } };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

const proxy = window.TelegramWebviewProxy;
const facts = {
  userAgent: navigator.userAgent,
  telegramGlobals: Object.keys(window).filter((k) => /telegram/i.test(k)),
  referrer: document.referrer, historyLength: history.length,
  screen: { width: screen.width, height: screen.height, innerWidth, innerHeight, dpr: devicePixelRatio },
};
const detected = !!proxy || /Telegram/i.test(navigator.userAgent);
(state.results.visits ??= []).push({ at: new Date().toISOString(), detected, facts });

// Sent after every step, replacing this test's last upload.
const send = (beacon = false) => {
  save();
  const body = JSON.stringify({ kind: "telegram-test-2", id: state.id, sentAt: new Date().toISOString(), step: state.step, ...state.results });
  const url = `play-data?device=tg2-${state.id}`;
  if (beacon) navigator.sendBeacon(url, new Blob([body], { type: "application/json" }));
  else fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body }).catch(() => {});
};

// The layouts to swipe in. All block the browser's own handling of the touch (as the
// game does); they differ in size and in whether the page itself can scroll a little.
const BOXES = [
  { key: "small", title: "Swipe in the box", text: "Left, right, up and down, a few times each." },
  { key: "full", title: "Swipe anywhere", text: "Left, right, up and down, a few times each. This one fills the screen, like the game.", full: true },
  { key: "fullScroll", title: "Swipe anywhere", text: "Left, right, up and down, a few times each. Same as before, with one small change behind the scenes.", full: true, scroll: true },
  { key: "edges", title: "Swipe in from the edges", text: "Start right on the left edge and swipe right, then from the right edge to the left, then from the top edge down.", full: true, scroll: true },
];
const steps = [{ kind: "where" }, ...BOXES.map((box) => ({ kind: "box", box })), { kind: "outside" }, { kind: "done" }];
const app = document.getElementById("app");
const next = () => { state.step++; state.asking = false; unscroll(); send(); show(); };

// The page made a few px larger than the screen and scrolled into the middle of that, so
// it can scroll a little every way (the browser's scrolling may then win the swipe over its
// own close gesture).
const scrollable = () => {
  document.documentElement.style.cssText = "overflow: auto";
  document.body.style.cssText = "width: calc(100vw + 8px); height: calc(100vh + 8px)";
  scrollTo(4, 4);
};
const unscroll = () => { document.documentElement.style.cssText = ""; document.body.style.cssText = ""; };

function show() {
  const s = steps[state.step];
  save();
  const counter = `<p class="count">Step ${state.step + 1} of ${steps.length}</p>`;
  const answer = (handler) => (app.onclick = (e) => { const a = e.target.closest("button")?.dataset.a; if (a) handler(a); });
  if (s.kind === "where") {
    app.innerHTML = `${counter}<h1>Which browser is showing this page?</h1><p>Telegram's own browser has Telegram's bar at the top (✕ and ⋮, or Done on iPhone).</p>
      <div class="buttons"><button data-a="telegram">Telegram's browser</button><button class="light" data-a="other">Chrome, Safari or another browser</button></div>`;
    answer((a) => { state.results.where = a; state.results.detected = detected; next(); });
    return;
  }
  if (s.kind === "box") {
    const { box } = s, r = (state.results.boxes[box.key] ??= { swipes: [] });
    // After the swipes (or after the page closed during them): did the browser try to close?
    if (state.asking) {
      app.innerHTML = `${counter}<h1>Did the browser try to close?</h1><p>While you swiped: did the page slide away, shrink, go back or close, even for a moment?</p>
        <div class="buttons"><button data-a="yes">Yes</button><button class="light" data-a="no">No, it stayed put</button></div>`;
      answer((a) => { r.triedToClose = a === "yes"; next(); });
      return;
    }
    if (box.scroll) scrollable();
    app.innerHTML = box.full
      ? `<div class="box full" id="box">${counter.replace('class="count"', 'class="count" style="color:#dfe5ec"')}<h1>${box.title}</h1><p>${box.text}</p><small id="n">0 swipes</small><div class="buttons"><button id="next" disabled>Done swiping</button></div></div>`
      : `${counter}<h1>${box.title}</h1><p>${box.text}</p><div class="box" id="box">Swipe here<small id="n">0 swipes</small></div><div class="buttons"><button id="next" disabled>Done swiping</button></div>`;
    const el = document.getElementById("box"), n = document.getElementById("n"), btn = document.getElementById("next");
    el.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
    let down = null, made = r.swipes.length;
    n.textContent = `${made} swipes`;
    el.addEventListener("pointerdown", (e) => {
      if (e.target.closest("button")) return;
      down = { x: e.clientX, y: e.clientY, t: performance.now(), moves: 0 };
      state.inSwipe = box.key; save();
    });
    el.addEventListener("pointermove", (e) => { if (down) { down.moves++; down.lx = e.clientX; down.ly = e.clientY; } });
    const end = (how) => () => {
      if (!down) return;
      const dx = Math.round((down.lx ?? down.x) - down.x), dy = Math.round((down.ly ?? down.y) - down.y);
      const way = Math.abs(dx) < 30 && Math.abs(dy) < 30 ? "tap" : Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : dy > 0 ? "down" : "up";
      r.swipes.push({ how, way, x0: Math.round(down.x), y0: Math.round(down.y), dx, dy, ms: Math.round(performance.now() - down.t), moves: down.moves });
      down = null; made++; state.inSwipe = null; save();
      n.textContent = `${made} swipes`;
      if (made >= 4) btn.disabled = false;
    };
    el.addEventListener("pointerup", end("up"));
    el.addEventListener("pointercancel", end("taken by the browser"));
    btn.addEventListener("click", () => { state.asking = true; unscroll(); send(); show(); });
    app.onclick = null;
    return;
  }
  if (s.kind === "outside") {
    app.innerHTML = `${counter}<h1>Now open this page in your phone's own browser</h1>
      <p>In Telegram's browser: tap ⋮ (top right) on Android, or the ⋯ / share menu on iPhone, and choose <b>Open in browser</b> (or Open in Safari / Chrome). Then do the test there too.</p>
      <div class="buttons"><button data-a="opened">Done, it opened in my browser</button><button class="light" data-a="couldnt">I couldn't find a way</button><button class="light" data-a="already">I'm already in my own browser</button></div>`;
    answer((a) => { state.results.openOutside = a; next(); });
    return;
  }
  app.innerHTML = `<h1>All done, thanks!</h1><p>The results have been sent. You can close this page.</p><div class="buttons"><button class="light" data-a="restart">Start again</button></div>`;
  answer(() => (location.href = "?restart"));
  send();
}

// The page left in the middle of a swipe (a swipe that closed it, say): note it, and ask
// about it when it is opened again.
addEventListener("pagehide", () => {
  if (state.inSwipe) { (state.results.leftDuring ??= []).push(state.inSwipe); state.inSwipe = null; state.asking = true; }
  send(true);
});
show();
</script>
</body>
</html>
